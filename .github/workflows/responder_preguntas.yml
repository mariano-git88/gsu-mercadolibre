name: Responder preguntas (fuera de hora)

# Cubre las horas que NO cubre sincronizar_stock.yml, que ya responde
# preguntas cada 15 minutos de 8 a 21 AR de lunes a sábado:
#
#   - las noches de lunes a sábado (21 a 8 AR = 0 a 11 UTC)
#   - los domingos completos
#
# Cada hora y no cada 15 minutos por los minutos de Actions: el plan gratuito
# da 2.000 por mes y el sync de stock ya se lleva ~1.456. Cada hora agrega
# ~382, así que el total queda cerca de 1.840. A cada 30 minutos se pasaría.
#
# La contrapartida honesta: una pregunta que entra a las 3 de la mañana puede
# esperar hasta una hora. En el horario que importa, la respuesta sigue
# saliendo en 15 minutos o menos.
on:
  schedule:
    - cron: '0 0-10 * * 1-6'     # noches de lunes a sábado
    - cron: '0 * * * 0'          # domingos completos
  workflow_dispatch:
    inputs:
      simular:
        description: 'Redactar sin publicar'
        type: boolean
        default: false

concurrency:
  # No se pisa consigo mismo ni con el sync de stock: procesar dos veces la
  # misma pregunta no la duplica (procesar() es idempotente por question_id)
  # pero gasta llamadas al modelo al pedo.
  group: responder-preguntas
  cancel-in-progress: false

jobs:
  responder:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt

      - name: Escribir los secrets
        env:
          SECRETS_TOML: ${{ secrets.GSU_ML_SECRETS_TOML }}
        run: |
          if [ -z "$SECRETS_TOML" ]; then
            echo "Falta el secret GSU_ML_SECRETS_TOML."; exit 1
          fi
          mkdir -p .streamlit
          printf '%s' "$SECRETS_TOML" > .streamlit/secrets.toml

      - name: Responder lo que se pueda
        run: |
          if [ "${{ inputs.simular }}" = "true" ]; then
            python preguntas_cron.py --simular
          else
            python preguntas_cron.py
          fi

      - name: Limpiar credenciales
        if: always()
        run: rm -f .streamlit/secrets.toml
