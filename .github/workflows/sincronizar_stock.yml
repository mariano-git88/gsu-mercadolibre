name: Sincronizar stock

# Cada 2 horas, de 8 a 20 hs de Uruguay (11-23 UTC), de lunes a sábado.
#
# Por qué tan espaciado: esta cuenta hace ~1,5 órdenes por día. Correr cada 15
# minutos —como en Argentina, que tiene ~40 veces el volumen— serían 56
# corridas diarias para encontrar, casi siempre, nada nuevo.
#
# No se pierde ninguna venta: cada corrida revisa los últimos 3 días, así que
# lo que pase de madrugada o el domingo entra en la primera corrida siguiente.
on:
  schedule:
    - cron: '0 11-23/2 * * 1-6'
  workflow_dispatch:        # permite correrlo a mano desde la pestaña Actions

concurrency:
  # Si una corrida se demora, la siguiente espera en vez de pisarla:
  # dos sincronizaciones simultáneas podrían renovar el token a la vez.
  group: sincronizar-stock
  cancel-in-progress: false

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Escribir los secrets
        env:
          SECRETS_TOML: ${{ secrets.GSU_ML_SECRETS_TOML }}
        run: |
          if [ -z "$SECRETS_TOML" ]; then
            echo "Falta el secret GSU_ML_SECRETS_TOML en el repositorio."
            exit 1
          fi
          mkdir -p .streamlit
          printf '%s' "$SECRETS_TOML" > .streamlit/secrets.toml

      - name: Sincronizar ventas
        run: python stock_control.py --dias 3

      # El paso de responder preguntas con IA que hay en la version argentina
      # NO va acá: esta cuenta tiene 33 preguntas en toda su historia y el
      # motor arma su base con BM25 sobre las respuestas propias. Sin base, el
      # modelo se abstiene siempre. Ver NOTAS_PORTEO.md.

      - name: Limpiar credenciales
        if: always()
        run: rm -f .streamlit/secrets.toml
